spring:
  application:
    name: ems
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads/profile-pictures}
    allowed-content-types: image/jpeg,image/png,image/jpg
